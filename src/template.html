<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div class="weather-container">
        <h1 class="app-title">Weather App</h1>

        </div>

        <div id="weatherContainer"></div> 
    </div>
</body>
